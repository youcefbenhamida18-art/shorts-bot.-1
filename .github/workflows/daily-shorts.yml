name: Daily Viral Shorts

on:
  schedule:
    # 04:00 UTC = 05:00 morning in UTC+1 (Algeria / Morocco). Change to your timezone:
    # UTC+3 (Saudi/Iraq) -> "0 2 * * *"   |   UTC+2 (Egypt) -> "0 3 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only render the videos (no YouTube upload)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  make-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg + Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-core fonts-noto-ui-core
          fc-cache -f

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and schedule videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # ---- settings (edit freely) ----
          VIDEOS_PER_RUN: "3"
          POST_SLOTS: "12:30,18:00,21:00"
          TZ_OFFSET_HOURS: "1"
          CHANNEL_NAME: ""
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node src/main.js

      - name: Keep the rendered videos for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Save history (prevents repeats, keeps the schedule alive)
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || (git commit -m "chore: update history" && git push)
